name: collect
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: read the Senate site
        run: python collect.py
      - name: commit what it read, on every run
        if: always()
        run: |
          git config user.name "kenu-senate-trades collector"
          git config user.email "actions@users.noreply.github.com"
          git add last_run.json
          [ ! -d data ] || git add data
          git diff --cached --quiet || git commit -q -m "collector run $(date -u +%FT%TZ)"
          git push
